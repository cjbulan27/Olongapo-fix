<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olongapo FixIt – Report. Monitor. Improve Our Community.</title>
<meta name="description" content="Report public problems in Olongapo City and track them from submission to resolution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23123b37'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial,sans-serif' font-size='44' font-weight='700' fill='white'%3EOF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
</head>
<body>
<div id="shell">
  <header class="top">
    <button class="burger" aria-label="Open navigation menu" aria-controls="side" aria-expanded="false" onclick="const open=document.body.classList.toggle('menu');this.setAttribute('aria-expanded',open);this.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu')"><span></span>Menu</button>
    <a class="brand" href="#/" aria-label="Olongapo FixIt home"><img class="brand-logo" src="/assets/Olongapo-fix.jfif" alt="Olongapo FixIt logo">Olongapo <b>FixIt</b></a>
    <nav id="pnav" class="pnav" aria-label="Main"></nav>
    <div id="who" class="who"></div>
  </header>
  <aside id="side" class="side" aria-label="Menu"></aside>
  <div class="content">
    <a class="skip-link" href="#app">Skip to main content</a>
    <main id="app" class="page" tabindex="-1"></main>
    <footer>© Olongapo FixIt · A community reporting platform for Olongapo City</footer>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button id="chat-toggle" class="chat-toggle" type="button" aria-controls="chat-panel" aria-expanded="false" onclick="toggleChat()">Ask FixIt</button>
<section id="chat-panel" class="chat-panel" role="dialog" aria-label="FixIt Assistant" hidden>
  <header class="chat-header"><div><strong>FixIt Assistant</strong><small>Barangay services and system help</small></div><div><button id="chat-new" type="button" class="chat-new" onclick="newChat()">New chat</button><button type="button" class="chat-close" aria-label="Close chat" onclick="toggleChat(false)">×</button></div></header>
  <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
  <div id="chat-suggestions" class="chat-suggestions">
    <button type="button" onclick="sendChatSuggestion(this)">What are the requirements for a barangay clearance?</button>
    <button type="button" onclick="sendChatSuggestion(this)">How many residents are in Kalalake?</button>
    <button type="button" onclick="sendChatSuggestion(this)">How do I use the map filter?</button>
  </div>
  <form class="chat-form" onsubmit="sendChatMessage(event)"><label class="sr-only" for="chat-input">Your message</label><textarea id="chat-input" rows="2" maxlength="1000" placeholder="Type your question…" required></textarea><button id="chat-send" class="btn" type="submit">Send</button></form>
  <p id="chat-status" class="chat-status" role="status" aria-live="polite"></p>
</section>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/core.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/public.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/residents.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
